<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glyph Flow — 살아있는 문자 그림</title>
<meta name="description" content="사진을 끊임없이 움직이는 문자 예술로 바꾸세요.">
<style>
:root{--ink:#182322;--cream:#f2efe7;--orange:#ef5b2a;--line:#bdb9ae}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink)}body{font-family:Arial,sans-serif}button,input{font:inherit}button{color:inherit}.topbar{height:82px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 3.3vw}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.04em}.brand i{color:var(--orange);font-style:normal}.brandMark{display:grid;place-items:center;width:34px;height:34px;border:2px solid var(--ink);border-radius:50%;font-family:Georgia,serif;font-size:20px}.headerActions{display:flex;align-items:center;gap:28px}.privacy{font:11px Consolas,monospace;color:#68706d}.privacy span{color:#32a06b;font-size:8px}.saveButton{border:0;background:var(--ink);color:white;padding:12px 16px;font-size:13px;cursor:pointer}.saveButton:hover{background:var(--orange)}.saveButton b{margin-left:17px;font-size:16px}.workspace{display:grid;grid-template-columns:minmax(320px,34vw) 1fr;min-height:calc(100vh - 130px)}.controls{padding:42px 3.3vw 34px;border-right:1px solid var(--line)}.eyebrow{font:700 10px Consolas,monospace;letter-spacing:.15em;color:var(--orange);margin-bottom:18px}h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(38px,3.3vw,60px);line-height:.98;letter-spacing:-.055em;margin:0}h1 em{color:var(--orange);font-weight:400}.intro{color:#5f6865;max-width:390px;font-size:14px;line-height:1.65;margin:20px 0 26px}.dropzone{border:1px dashed #9b9c94;padding:19px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:.2s;background:#ffffff2e}.dropzone:hover,.dropzone.dragging{border-color:var(--orange);background:#fff8ef}.dropzone input{display:none}.uploadIcon{width:40px;height:40px;display:grid;place-items:center;background:var(--ink);color:white;font-size:22px}.dropzone strong,.dropzone small{display:block}.dropzone strong{font-size:13px;margin-bottom:4px}.dropzone small{font:9px Consolas,monospace;color:#80837d}.controlGroup{margin-top:25px}.controlGroup label,.modeRow{display:flex;justify-content:space-between;font-size:12px;font-weight:700}.controlGroup label span{color:var(--orange);font:600 10px Consolas,monospace}.styleGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.styleGrid button{height:42px;background:transparent;border:1px solid var(--line);font:11px Consolas,monospace;cursor:pointer;overflow:hidden}.styleGrid button:hover,.styleGrid button.active{background:var(--ink);color:#fff;border-color:var(--ink)}.slider input{width:100%;accent-color:var(--orange);margin:12px 0 2px;cursor:pointer}.rangeLabels{display:flex;justify-content:space-between;color:#8c8d87;font-size:9px}.modeRow{border-top:1px solid var(--line);margin-top:24px;padding-top:18px;align-items:center}.switch{width:38px;height:21px;border:0;border-radius:20px;background:#aaa;padding:3px;cursor:pointer}.switch i{display:block;width:15px;height:15px;border-radius:50%;background:white;transition:.2s}.switch.on{background:var(--orange)}.switch.on i{transform:translateX(17px)}.stage{padding:32px 3.3vw;min-width:0;display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at 52% 45%,#f8f5ec 0,transparent 52%)}.stageMeta{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.stageMeta span,.stageMeta strong{display:block}.stageMeta span{font:700 9px Consolas,monospace;color:#8d8d86;letter-spacing:.12em}.stageMeta strong{font-family:Georgia,serif;font-size:18px;margin-top:3px;font-weight:400}.live{font:10px Consolas,monospace;color:#676e6b}.live i{display:inline-block;width:6px;height:6px;background:var(--orange);border-radius:50%;margin-right:5px;box-shadow:0 0 0 4px #ef5b2a22}.canvasShell{position:relative;width:100%;background:#0b1112;box-shadow:0 25px 55px #26322d20}canvas{display:block;width:100%;height:auto}.corner{position:absolute;width:15px;height:15px;border-color:var(--orange);border-style:solid}.tl{top:-5px;left:-5px;border-width:2px 0 0 2px}.tr{top:-5px;right:-5px;border-width:2px 2px 0 0}.bl{bottom:-5px;left:-5px;border-width:0 0 2px 2px}.br{bottom:-5px;right:-5px;border-width:0 2px 2px 0}.playbar{display:flex;align-items:center;gap:13px;margin-top:18px}.pause{width:36px;height:36px;border:1px solid var(--ink);background:transparent;cursor:pointer}.pause:hover{background:var(--ink);color:white}.playbar strong,.playbar span{display:block}.playbar strong{font-size:11px}.playbar span{font:9px Consolas,monospace;color:#96978f;margin-top:2px}.playbar p{margin-left:auto;text-align:right;font-size:9px;line-height:1.5;color:#979891}footer{height:48px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 3.3vw;color:#888b84;font:9px Consolas,monospace;letter-spacing:.06em}@media(max-width:850px){.workspace{grid-template-columns:1fr}.controls{border-right:0;border-bottom:1px solid var(--line)}.stage{padding-top:26px}.privacy{display:none}}@media(max-width:520px){.topbar{height:68px}.brand span:last-child{font-size:13px}.saveButton{padding:10px}.saveButton b{margin-left:8px}.controls,.stage{padding-left:20px;padding-right:20px}.playbar p{display:none}footer span:last-child{display:none}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><span class="brandMark">G</span><span>GLYPH <i>FLOW</i></span></div><div class="headerActions"><span class="privacy"><span>●</span> 모든 처리는 이 기기에서</span><button class="saveButton" id="save">이미지 저장 <b>↓</b></button></div></header>
<main class="workspace"><aside class="controls"><div class="eyebrow">PLAYGROUND / 01</div><h1>이미지를<br><em>살아있는 문자</em>로.</h1><p class="intro">사진의 빛과 색을 읽고, 끊임없이 움직이는 타이포그래피로 다시 그립니다.</p>
<label class="dropzone" id="drop"><input id="file" type="file" accept="image/*"><span class="uploadIcon">↥</span><span><strong>이미지를 놓거나 선택하세요</strong><small>JPG, PNG, WEBP · 최대 20MB</small></span></label>
<div class="controlGroup"><label>문자 스타일 <span id="styleName">클래식</span></label><div class="styleGrid"><button class="active" data-set="@%#*+=-:. " data-name="클래식">@%#*+</button><button data-set="●◉○•·  " data-name="도트">●◉○•·</button><button data-set="█▓▒░  " data-name="블록">█▓▒░</button><button data-set="01{}[]/\\&lt;&gt;;:._ " data-name="코드">01{}[</button></div></div>
<div class="controlGroup slider"><label>문자 밀도 <span id="densityVal">62%</span></label><input id="density" type="range" min="0" max="100" value="62"><div class="rangeLabels"><span>느슨하게</span><span>촘촘하게</span></div></div>
<div class="controlGroup slider"><label>변화 속도 <span id="speedVal">70%</span></label><input id="speed" type="range" min="0" max="100" value="70"><div class="rangeLabels"><span>고요하게</span><span>빠르게</span></div></div>
<div class="controlGroup slider"><label>움직임 <span id="energyVal">42%</span></label><input id="energy" type="range" min="0" max="100" value="42"><div class="rangeLabels"><span>은은하게</span><span>역동적으로</span></div></div>
<div class="modeRow"><span>원본 색상</span><button class="switch on" id="color" aria-label="원본 색상"><i></i></button></div></aside>
<section class="stage"><div class="stageMeta"><div><span>LIVE CANVAS</span><strong id="name">황혼의 산맥</strong></div><div class="live"><i></i> 실시간 렌더링</div></div><div class="canvasShell"><canvas id="canvas"></canvas><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></div><div class="playbar"><button class="pause" id="pause">Ⅱ</button><div><strong id="state">문자가 흐르는 중</strong><span id="count">111 × 42 GLYPHS</span></div><p>사진은 서버로 전송되지 않습니다.<br>당신의 브라우저 안에서만 머뭅니다.</p></div></section></main>
<footer><span>GLYPH FLOW © 2026</span><span>빛을 문자로, 정지를 움직임으로.</span></footer>
<script>
const $=s=>document.querySelector(s), canvas=$('#canvas'), ctx=canvas.getContext('2d',{alpha:false});let source,chars='@%#*+=-:. ',paused=false,color=true,density=62,speed=70,energy=42,fileName='황혼의 산맥';
function demo(){let c=document.createElement('canvas');c.width=1200;c.height=760;let x=c.getContext('2d'),g=x.createLinearGradient(0,0,1200,760);g.addColorStop(0,'#142b31');g.addColorStop(.55,'#bf5f3f');g.addColorStop(1,'#f0bd6a');x.fillStyle=g;x.fillRect(0,0,1200,760);x.fillStyle='rgba(255,238,183,.4)';x.beginPath();x.arc(940,180,95,0,Math.PI*2);x.fill();[['#17343b',[0,610,260,325,475,610]],['#234b4e',[245,610,570,245,855,610]],['#315f5a',[625,610,885,360,1200,640]]].forEach(a=>{x.fillStyle=a[0];x.beginPath();x.moveTo(a[1][0],a[1][1]);x.lineTo(a[1][2],a[1][3]);x.lineTo(a[1][4],a[1][5]);x.fill()});x.fillStyle='#10282c';x.fillRect(0,605,1200,155);return c}source=demo();
function paint(target,w,h,t){target.fillStyle='#0b1112';target.fillRect(0,0,w,h);let cols=Math.round(32+density*1.28),cw=w/cols,rows=Math.max(1,Math.round(h/(cw*1.68))),ch=h/rows,s=document.createElement('canvas');s.width=cols;s.height=rows;let sx=s.getContext('2d',{willReadFrequently:true});sx.drawImage(source,0,0,cols,rows);let p=sx.getImageData(0,0,cols,rows).data,tick=paused?0:Math.floor(t/Math.max(35,290-speed*2.5));target.font=Math.ceil(ch*.9)+'px Consolas,monospace';target.textAlign='center';target.textBaseline='middle';for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let i=(y*cols+x)*4,r=p[i],g=p[i+1],b=p[i+2],l=(r*.2126+g*.7152+b*.0722)/255,base=Math.min(chars.length-1,Math.floor((1-l)*chars.length)),n=Math.sin(x*12.9898+y*78.233+tick*2.71)*43758.5453,shift=Math.abs(n-Math.floor(n))<energy/100?(x+y+tick)%3-1:0,chx=chars[Math.max(0,Math.min(chars.length-1,base+shift))];if(chx===' ')continue;target.fillStyle=color?`rgb(${Math.min(255,r+18)},${Math.min(255,g+18)},${Math.min(255,b+18)})`:`rgb(${70+l*185},${82+l*173},${77+l*178})`;target.globalAlpha=.45+l*.55;target.fillText(chx,(x+.5)*cw,(y+.5)*ch)}target.globalAlpha=1;return[cols,rows]}
function draw(t){let w=Math.max(320,Math.floor(canvas.getBoundingClientRect().width)),ratio=source.width/source.height,h=Math.floor(w/ratio),d=Math.min(devicePixelRatio||1,2);canvas.style.aspectRatio=source.width+' / '+source.height;if(canvas.width!==w*d||canvas.height!==h*d){canvas.width=w*d;canvas.height=h*d}ctx.setTransform(d,0,0,d,0,0);let grid=paint(ctx,w,h,t);$('#count').textContent=grid[0]+' × '+grid[1]+' GLYPHS';requestAnimationFrame(draw)}requestAnimationFrame(draw);
['density','speed','energy'].forEach(id=>$('#'+id).oninput=e=>{window[id]=+e.target.value;eval(id+'=+e.target.value');$('#'+id+'Val').textContent=e.target.value+'%'});document.querySelectorAll('.styleGrid button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.styleGrid button').forEach(x=>x.classList.remove('active'));b.classList.add('active');chars=b.dataset.set;$('#styleName').textContent=b.dataset.name});$('#color').onclick=e=>{color=!color;e.currentTarget.classList.toggle('on',color)};$('#pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶':'Ⅱ';$('#state').textContent=paused?'숨을 고르는 중':'문자가 흐르는 중'};
function load(f){if(!f||!f.type.startsWith('image/')||f.size>20971520)return;let img=new Image(),u=URL.createObjectURL(f);img.onload=()=>{source=img;fileName=f.name.replace(/\.[^.]+$/,'');$('#name').textContent=fileName;URL.revokeObjectURL(u)};img.src=u}$('#file').onchange=e=>load(e.target.files[0]);let drop=$('#drop');['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('dragging')}));['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('dragging')}));drop.addEventListener('drop',e=>load(e.dataTransfer.files[0]));$('#save').onclick=()=>{let max=4e7,scale=Math.min(1,Math.sqrt(max/(source.width*source.height))),w=Math.max(1,Math.round(source.width*scale)),h=Math.max(1,Math.round(source.height*scale)),out=document.createElement('canvas');out.width=w;out.height=h;paint(out.getContext('2d',{alpha:false}),w,h,performance.now());let a=document.createElement('a');a.download=(fileName||'glyph-flow')+'.png';a.href=out.toDataURL('image/png');a.click()};
</script></body></html>
